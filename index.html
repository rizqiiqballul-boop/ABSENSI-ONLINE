<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Kuliah Online</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d6efd,#4dabf7);color:#222;min-height:100vh}
    .wrap{max-width:430px;margin:auto;padding:20px}
    .card{background:rgba(255,255,255,.97);border-radius:18px;padding:22px;box-shadow:0 10px 35px #003b7a35}
    h1{font-size:24px;margin:0 0 8px}
    h2{font-size:19px;margin:0 0 18px}
    p{color:#666}
    input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:15px}
    input{border:1px solid #ddd}
    button{border:0;background:#0d6efd;color:white;cursor:pointer;font-weight:bold;transition:.2s}button:hover{background:#0b5ed7;transform:translateY(-1px)}
    button.secondary{background:#e9ecef;color:#222}
    .hidden{display:none}
    .profile{text-align:center}.profile h2{color:#0b5ed7}
    .profile img,.student-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#eee}
    .info{background:#f7f7f7;border-radius:12px;padding:12px;margin:15px 0}
    .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
    .row:last-child{border:0}
    .status{padding:10px;border-radius:10px;text-align:center;background:#e8f7ed;color:#16803c;font-weight:bold}
    .student{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
    .student-photo{width:48px;height:48px}
    .small{font-size:13px;color:#777}
    .tabs{display:flex;gap:8px;margin-bottom:15px}
    .tabs button{margin:0}
    .tabs button.active{background:#333}
    label{font-size:13px;color:#555}
  </style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card">
    <h1>Absensi Kuliah</h1>
    <p>Silakan masuk untuk melakukan absensi.</p>
    <div class="tabs">
      <button id="mTab" class="active" onclick="setRole('mahasiswa')">Mahasiswa</button>
      <button id="dTab" class="secondary" onclick="setRole('dosen')">Dosen</button>
    </div>

    <div id="studentLogin">
      <label>NIM</label>
      <input id="nim" placeholder="Masukkan NIM">
      <label>Password</label>
      <input id="studentPass" type="password" placeholder="Masukkan password">
      <button onclick="loginStudent()">Login Mahasiswa</button>
    </div>

    <div id="lecturerLogin" class="hidden">
      <label>Username</label>
      <input id="username" placeholder="Username dosen">
      <label>Password</label>
      <input id="lecturerPass" type="password" placeholder="Password">
      <button onclick="loginLecturer()">Login Dosen</button>
    </div>
  </div>

  <div id="studentDashboard" class="card hidden">
    <div class="profile">
      <img id="profilePreview" src="" alt="Foto">
      <h2 id="studentName">Mahasiswa</h2>
      <div class="info">
        <div class="row"><span>NIM</span><b id="studentNim"></b></div>
        <div class="row"><span>Kelas</span><b id="studentClass"></b></div>
      </div>
    </div>

    <label>Foto bukti kehadiran</label>
    <input id="attendancePhoto" type="file" accept="image/*" capture="user" onchange="previewAttendance()">
    <button onclick="submitAttendance()">ABSEN HADIR</button>
    <div id="studentStatus"></div>
    <button class="secondary" onclick="logout()">Keluar</button>
  </div>

  <div id="lecturerDashboard" class="card hidden">
    <h2>Dashboard Dosen</h2>
    <div class="info">
      <div class="row"><span>Total mahasiswa</span><b id="totalStudents">0</b></div>
      <div class="row"><span>Sudah hadir</span><b id="totalPresent">0</b></div>
    </div>
    <input id="search" placeholder="Cari nama atau NIM..." oninput="renderStudents()">
    <div id="studentList"></div>
    <button class="secondary" onclick="logout()">Keluar</button>
  </div>

</div>

<script>
  const students = [
    {name:"Ahmad", nim:"12345678", className:"A", password:"1234"},
    {name:"Budi", nim:"87654321", className:"A", password:"1234"},
    {name:"Citra", nim:"11223344", className:"B", password:"1234"}
  ];

  let role = "mahasiswa";
  let currentStudent = null;
  let attendanceImage = "";

  function setRole(r){
    role = r;
    document.getElementById("studentLogin").classList.toggle("hidden", r !== "mahasiswa");
    document.getElementById("lecturerLogin").classList.toggle("hidden", r !== "dosen");
    document.getElementById("mTab").className = r === "mahasiswa" ? "active" : "secondary";
    document.getElementById("dTab").className = r === "dosen" ? "active" : "secondary";
  }

  function loginStudent(){
    const nim = document.getElementById("nim").value.trim();
    const pass = document.getElementById("studentPass").value;
    const s = students.find(x => x.nim === nim && x.password === pass);
    if(!s) return alert("NIM atau password salah.");
    currentStudent = s;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("studentDashboard").classList.remove("hidden");
    document.getElementById("studentName").textContent = s.name;
    document.getElementById("studentNim").textContent = s.nim;
    document.getElementById("studentClass").textContent = s.className;
    document.getElementById("profilePreview").src = "https://ui-avatars.com/api/?name="+encodeURIComponent(s.name);
    showStudentStatus();
  }

  function loginLecturer(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("lecturerPass").value;
    if(u !== "dosen" || p !== "1234") return alert("Username atau password dosen salah.");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("lecturerDashboard").classList.remove("hidden");
    renderStudents();
  }

  function previewAttendance(){
    const file = document.getElementById("attendancePhoto").files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => attendanceImage = e.target.result;
    reader.readAsDataURL(file);
  }

  function submitAttendance(){
    if(!currentStudent) return;
    if(!attendanceImage) return alert("Silakan pilih atau ambil foto terlebih dahulu.");
    const data = JSON.parse(localStorage.getItem("attendance") || "{}");
    data[currentStudent.nim] = {
      name: currentStudent.name,
      nim: currentStudent.nim,
      className: currentStudent.className,
      image: attendanceImage,
      status: "Hadir"
    };
    localStorage.setItem("attendance", JSON.stringify(data));
    showStudentStatus();
    alert("Absensi berhasil disimpan.");
  }

  function showStudentStatus(){
    const data = JSON.parse(localStorage.getItem("attendance") || "{}");
    const a = data[currentStudent.nim];
    document.getElementById("studentStatus").innerHTML =
      a ? '<div class="status">✓ Sudah Hadir</div>' : '<div class="small">Belum melakukan absensi.</div>';
  }

  function renderStudents(){
    const q = (document.getElementById("search").value || "").toLowerCase();
    const data = JSON.parse(localStorage.getItem("attendance") || "{}");
    const list = students.filter(s => (s.name+s.nim).toLowerCase().includes(q));
    document.getElementById("totalStudents").textContent = students.length;
    document.getElementById("totalPresent").textContent = Object.keys(data).length;
    document.getElementById("studentList").innerHTML = list.map(s => {
      const a = data[s.nim];
      return `<div class="student">
        <img class="student-photo" src="${a?.image || 'https://ui-avatars.com/api/?name='+encodeURIComponent(s.name)}">
        <div style="flex:1">
          <b>${s.name}</b><br>
          <span class="small">${s.nim} · Kelas ${s.className}</span>
        </div>
        <b>${a ? "Hadir" : "Belum"}</b>
      </div>`;
    }).join("");
  }

  function logout(){
    currentStudent = null;
    attendanceImage = "";
    document.getElementById("studentDashboard").classList.add("hidden");
    document.getElementById("lecturerDashboard").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
  }
</script>
</body>
</html>
