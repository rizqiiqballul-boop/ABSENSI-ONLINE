<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Online</title>
<style>
:root{--p:#2563eb;--dark:#0f172a;--muted:#64748b;--bg:#f1f5f9;--card:#fff;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:var(--dark)}
button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#2563eb,#0f172a)}
.box{background:#fff;border-radius:20px;padding:28px;width:min(460px,100%);box-shadow:0 20px 60px #0004}.brand{text-align:center;margin-bottom:20px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.full{width:100%;margin-top:16px}
.notice{background:#eff6ff;color:#1e40af;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.err{color:var(--bad);font-size:13px;margin-top:9px}
.top{height:66px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:3}
.layout{display:flex;min-height:calc(100vh - 66px)}aside{width:220px;background:#0f172a;padding:15px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#1e293b;color:#fff}
main{flex:1;padding:24px;max-width:1400px;width:100%;margin:auto}.title{margin-bottom:20px}.title h2{margin:0}.title p{margin:5px 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:18px;box-shadow:0 5px 18px #0f172a08}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:5px}.green{color:var(--ok)}.red{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px;white-space:nowrap}.table th{background:#f8fafc}
.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.hadir{background:#dcfce7;color:#166534}.izin{background:#fef3c7;color:#92400e}.sakit{background:#dbeafe;color:#1e40af}.alpa{background:#fee2e2;color:#991b1b}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.qrbox{display:grid;place-items:center;margin:15px auto;min-height:230px}
#reader{max-width:420px;margin:auto}.center{text-align:center}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}aside{width:100%;padding:7px}.layout{display:block}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){main{padding:15px}.grid{grid-template-columns:1fr 1fr}.top{padding:0 12px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <div class="brand"><h1>📋 Absensi Online</h1><p>Sistem Absensi Mahasiswa</p></div>
    <div id="loginForm">
      <label>Email</label><input id="email" type="email" placeholder="nama@email.com">
      <label>Password</label><input id="password" type="password" placeholder="Minimal 6 karakter">
      <button class="btn primary full" onclick="signIn()">Masuk</button>
      <button class="btn secondary full" onclick="showRegister()">Buat akun mahasiswa</button>
    </div>
    <div id="registerForm" class="hidden">
      <label>Nama lengkap</label><input id="regName" placeholder="Nama mahasiswa">
      <label>NIM</label><input id="regNim" placeholder="NIM">
      <label>Kelas</label><input id="regClass" placeholder="Contoh: XII Manajemen Bisnis">
      <label>Program studi</label><input id="regProdi" placeholder="Program studi">
      <label>Email</label><input id="regEmail" type="email" placeholder="nama@email.com">
      <label>Password</label><input id="regPass" type="password" placeholder="Minimal 6 karakter">
      <button class="btn primary full" onclick="signUp()">Daftar</button>
      <button class="btn secondary full" onclick="showLogin()">Kembali login</button>
    </div>
    <div id="authMsg" class="err"></div>
    <div class="notice">Website ini memakai Supabase. Data absensi tersimpan online, bukan hanya di browser.</div>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><b>📋 Absensi Online</b><span><small id="who"></small> &nbsp; <button class="btn danger" onclick="signOut()">Keluar</button></span></header>
<div class="layout">
<aside><div class="nav">
<button data-p="dashboard" onclick="page('dashboard',this)">🏠 Dashboard</button>
<button data-p="attendance" onclick="page('attendance',this)">📷 Absen</button>
<button data-p="history" onclick="page('history',this)">📝 Riwayat</button>
<button data-p="admin" class="adminOnly hidden" onclick="page('admin',this)">⚙️ Admin</button>
</div></aside>
<main id="main"></main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
const SUPABASE_URL="https://jogocofshcseabyzstvz.supabase.co";
const SUPABASE_KEY="sb_publishable_v92d4IPGlklrPgXGZ6BERA_3KcNwG91";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, scanner=null;

const $=id=>document.getElementById(id);
function showRegister(){$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");$("authMsg").textContent=""}
function showLogin(){$("registerForm").classList.add("hidden");$("loginForm").classList.remove("hidden");$("authMsg").textContent=""}
async function signUp(){
 const name=$("regName").value.trim(),nim=$("regNim").value.trim(),cls=$("regClass").value.trim(),prodi=$("regProdi").value.trim(),email=$("regEmail").value.trim(),pass=$("regPass").value;
 if(!name||!nim||!email||pass.length<6){$("authMsg").textContent="Lengkapi data dan gunakan password minimal 6 karakter.";return}
 const {error}=await db.auth.signUp({email,password:pass,options:{data:{name,nim,class_name:cls,prodi}}});
 if(error){$("authMsg").textContent=error.message;return}
 $("authMsg").textContent="Pendaftaran berhasil. Cek email jika verifikasi email aktif, lalu login.";
 showLogin();
}
async function signIn(){
 const email=$("email").value.trim(),pass=$("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password:pass});
 if(error){$("authMsg").textContent=error.message;return}
 await start(data.user);
}
async function signOut(){await db.auth.signOut();location.reload()}
async function start(user){
 const {data,error}=await db.from("profiles").select("*").eq("id",user.id).single();
 if(error){$("authMsg").textContent="Profile belum tersedia. Jalankan supabase_schema.sql dahulu.";await db.auth.signOut();return}
 me=data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.name+" · "+me.role;
 document.querySelectorAll(".adminOnly").forEach(x=>x.classList.toggle("hidden",me.role!=="admin"));
 page("dashboard",document.querySelector('[data-p="dashboard"]'));
}
function page(name,btn){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");
 ({dashboard:dashboard,attendance:attendance,history:history,admin:adminPage}[name]||dashboard)();
}
async function dashboard(){
 const {data:records=[]}=await db.from("attendance_records").select("*,attendance_sessions(course,class_name)").eq("student_id",me.id).order("checked_at",{ascending:false});
 const h=records.filter(x=>x.status==="Hadir").length,i=records.filter(x=>x.status==="Izin").length,s=records.filter(x=>x.status==="Sakit").length,a=records.filter(x=>x.status==="Alpa").length,total=records.length;
 const pct=total?Math.round(h/total*100):0;
 $("main").innerHTML=`<div class="title"><h2>Dashboard</h2><p>Selamat datang, ${esc(me.name)}.</p></div>
 <div class="grid"><div class="card stat"><small>Total absensi</small><strong>${total}</strong></div><div class="card stat"><small>Hadir</small><strong class="green">${h}</strong></div><div class="card stat"><small>Izin + Sakit</small><strong>${i+s}</strong></div><div class="card stat"><small>Kehadiran</small><strong>${pct}%</strong></div></div>
 <div class="two"><div class="card"><h3>Profil</h3><p><b>${esc(me.name)}</b><br>NIM: ${esc(me.nim||"-")}<br>Kelas: ${esc(me.class_name||"-")}<br>Prodi: ${esc(me.prodi||"-")}</p></div>
 <div class="card"><h3>Absensi</h3><p>Scan QR yang dibuat admin untuk mencatat kehadiran.</p><button class="btn primary" onclick="page('attendance')">📷 Absen sekarang</button></div></div>`;
}
async function attendance(){
 const now=new Date().toISOString();
 const {data:sessions,error}=await db.from("attendance_sessions").select("*").lte("start_at",now).gte("end_at",now).order("start_at",{ascending:true});
 if(error){$("main").innerHTML=msg(error.message);return}
 let list=(sessions||[]).map(s=>`<option value="${s.id}">${esc(s.course)} · ${esc(s.class_name)}</option>`).join("");
 $("main").innerHTML=`<div class="title"><h2>Absen Sekarang</h2><p>Scan QR dan verifikasi lokasi.</p></div>
 <div class="two"><div class="card center"><h3>Scan QR Code</h3><div id="reader"></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startScan()">📷 Buka kamera</button><button class="btn secondary" onclick="stopScan()">Tutup kamera</button></div><p id="scanResult"></p></div>
 <div class="card"><label>Sesi aktif</label><select id="sessionSelect">${list||'<option value="">Tidak ada sesi aktif</option>'}</select>
 <label>Status</label><select id="status"><option>Hadir</option><option>Izin</option><option>Sakit</option></select>
 <button class="btn secondary full" onclick="getGPS()">📍 Verifikasi GPS</button><p id="gpsStatus"></p>
 <button class="btn primary full" onclick="submitAttendance()">Simpan Absensi</button></div></div>`;
}
function startScan(){
 if(scanner)return;scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},decoded=>{
   $("scanResult").innerHTML="✅ QR terbaca: <b>"+esc(decoded)+"</b>";window.qrToken=decoded;stopScan();
 }).catch(e=>$("scanResult").textContent="Kamera tidak dapat dibuka: "+e);
}
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner.clear();scanner=null}}
function getGPS(){
 if(!navigator.geolocation){$("gpsStatus").textContent="GPS tidak tersedia.";return}
 $("gpsStatus").textContent="Memeriksa lokasi...";
 navigator.geolocation.getCurrentPosition(p=>{window.pos=p.coords;$("gpsStatus").innerHTML="✅ Lokasi terdeteksi.";},()=>{$("gpsStatus").textContent="❌ Izin lokasi ditolak."},{enableHighAccuracy:true,timeout:10000});
}
async function submitAttendance(){
 const token=window.qrToken;if(!token){alert("Scan QR terlebih dahulu.");return}
 const sid=$("sessionSelect").value;if(!sid){alert("Tidak ada sesi aktif.");return}
 const {data:s,error}=await db.from("attendance_sessions").select("*").eq("id",sid).single();if(error){alert(error.message);return}
 if(token!==s.token){alert("QR Code tidak cocok dengan sesi.");return}
 const {data:old}=await db.from("attendance_records").select("id").eq("session_id",sid).eq("student_id",me.id);
 if(old&&old.length){alert("Kamu sudah absen pada sesi ini.");return}
 let lat=null,lon=null;
 if(window.pos){lat=window.pos.latitude;lon=window.pos.longitude;
   if(s.latitude!=null&&s.longitude!=null&&distance(lat,lon,s.latitude,s.longitude)>s.radius_m){alert("Kamu berada di luar radius absensi.");return}
 }
 const {error:ins}=await db.from("attendance_records").insert({session_id:sid,student_id:me.id,status:$("status").value,latitude:lat,longitude:lon});
 if(ins){alert(ins.message);return} alert("Absensi berhasil dicatat!");window.qrToken=null;window.pos=null;page("dashboard");
}
async function history(){
 const {data,error}=await db.from("attendance_records").select("*,attendance_sessions(course,class_name)").eq("student_id",me.id).order("checked_at",{ascending:false});
 if(error){$("main").innerHTML=msg(error.message);return}
 const rows=(data||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${new Date(x.checked_at).toLocaleString("id-ID")}</td><td>${esc(x.attendance_sessions?.course||"-")}</td><td><span class="status ${x.status.toLowerCase()}">${x.status}</span></td></tr>`).join("");
 $("main").innerHTML=`<div class="title"><h2>Riwayat Absensi</h2><p>Data tersimpan di database online.</p></div><div class="card table"><table><tr><th>No</th><th>Waktu</th><th>Mata Kuliah</th><th>Status</th></tr>${rows||"<tr><td colspan=4>Belum ada data.</td></tr>"}</table></div>`;
}
async function adminPage(){
 const {data:sessions=[]}=await db.from("attendance_sessions").select("*").order("created_at",{ascending:false});
 const {data:records=[]}=await db.from("attendance_records").select("*,profiles(name,nim),attendance_sessions(course,class_name)").order("checked_at",{ascending:false}).limit(100);
 $("main").innerHTML=`<div class="title"><h2>Panel Admin</h2><p>Buat sesi QR dan lihat absensi mahasiswa.</p></div>
 <div class="two"><div class="card"><h3>Buat Sesi Absensi</h3><div class="formgrid">
 <div><label>Mata kuliah</label><input id="course" value="Manajemen Bisnis"></div><div><label>Kelas</label><input id="aclass" value="XII Manajemen Bisnis"></div>
 <div><label>Mulai</label><input id="start" type="datetime-local"></div><div><label>Selesai</label><input id="end" type="datetime-local"></div>
 <div><label>Latitude (opsional)</label><input id="lat" placeholder="-7.000000"></div><div><label>Longitude (opsional)</label><input id="lon" placeholder="108.000000"></div>
 <div><label>Radius (meter)</label><input id="radius" type="number" value="100"></div></div>
 <div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="adminGPS()">📍 Ambil lokasi saya</button><button class="btn primary" onclick="createSession()">Buat QR</button></div><div id="newQR" class="qrbox"></div></div>
 <div class="card"><h3>Sesi Terbaru</h3>${(sessions||[]).slice(0,8).map(s=>`<p><b>${esc(s.course)}</b><br>${esc(s.class_name)}<br><small>${new Date(s.start_at).toLocaleString("id-ID")} — ${new Date(s.end_at).toLocaleString("id-ID")}</small></p>`).join("<hr>")||"Belum ada sesi."}</div></div>
 <div class="card table" style="margin-top:16px"><h3>Absensi Terbaru</h3><table><tr><th>Mahasiswa</th><th>NIM</th><th>Mata Kuliah</th><th>Waktu</th><th>Status</th></tr>
 ${(records||[]).map(x=>`<tr><td>${esc(x.profiles?.name||"-")}</td><td>${esc(x.profiles?.nim||"-")}</td><td>${esc(x.attendance_sessions?.course||"-")}</td><td>${new Date(x.checked_at).toLocaleString("id-ID")}</td><td><span class="status ${x.status.toLowerCase()}">${x.status}</span></td></tr>`).join("")||"<tr><td colspan=5>Belum ada data.</td></tr>"}</table></div>`;
}
function adminGPS(){navigator.geolocation?.getCurrentPosition(p=>{$("lat").value=p.coords.latitude.toFixed(7);$("lon").value=p.coords.longitude.toFixed(7)},()=>alert("Lokasi tidak dapat diambil."),{enableHighAccuracy:true})}
async function createSession(){
 const course=$("course").value.trim(),cls=$("aclass").value.trim(),start=new Date($("start").value),end=new Date($("end").value);
 if(!course||!cls||isNaN(start)||isNaN(end)||end<=start){alert("Lengkapi data sesi.");return}
 const token=crypto.randomUUID().replaceAll("-","").slice(0,12).toUpperCase();
 const lat=parseFloat($("lat").value),lon=parseFloat($("lon").value),radius=parseInt($("radius").value||"100");
 const {data,error}=await db.from("attendance_sessions").insert({course,class_name:cls,start_at:start.toISOString(),end_at:end.toISOString(),latitude:Number.isFinite(lat)?lat:null,longitude:Number.isFinite(lon)?lon:null,radius_m:radius,token,created_by:me.id}).select().single();
 if(error){alert(error.message);return}
 $("newQR").innerHTML="";new QRCode($("newQR"),{text:token,width:220,height:220});$("newQR").insertAdjacentHTML("beforeend",`<p><b>Token: ${token}</b><br>${esc(course)} · ${esc(cls)}</p>`);
}
function distance(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180,da=to(c-a),db=to(d-b),q=Math.sin(da/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function msg(x){return `<div class="card">${esc(x)}</div>`}
db.auth.getSession().then(({data:{session}})=>{if(session)start(session.user)});
</script>
 <!-- ADMIN LOGIN -->
<div id="adminPanel" style="display:none;">
  <h2>👑 Admin Absensi</h2>

  <input id="adminEmail" type="email" placeholder="Email Admin">
  <input id="adminPassword" type="password" placeholder="Password Admin">

  <button onclick="loginAdmin()">Login Admin</button>

  <div id="adminDashboard" style="display:none;">
    <h3>Dashboard Admin</h3>
    <button onclick="buatQR()">🔳 Buat QR Absensi</button>
    <div id="qrAdmin" style="margin-top:20px;"></div>
  </div>
</div>

<script>
async function async function loginAdmin() {
  const email = document.getElementById("adminEmail").value;
  const password = document.getElementById("adminPassword").value;

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Login admin gagal: " + error.message);
    return;
  }

  document.getElementById("adminDashboard").style.display = "block";
  alert("Login admin berhasil!");
}
}

function buatQR() {
  const kode = "ABSEN-" + Date.now();

  document.getElementById("qrAdmin").innerHTML = `
    <h3>Scan QR Ini</h3>
    <div id="qrCode"></div>
    <p>Kode sesi: ${kode}</p>
  `;

  new QRCode(document.getElementById("qrCode"), {
    text: kode,
    width: 250,
    height: 250
  });
}
</script> 
</body>
  <button type="button" onclick="document.getElementById('adminPanel').style.display='block'">
  👑 Login Admin
</button>
</html>
